<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alarma de Parada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">

  <!-- Leaflet -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body { margin:0; font-family: Arial; padding:10px; }
    #map { height: 60vh; }
    button, input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h3>🚍 Alarma de Parada (PRO)</h3>
<p>Toca el mapa para marcar tu destino</p>

<div id="map"></div>

<input id="radius" type="number" value="500" placeholder="Radio en metros">
<button id="startBtn">▶ Activar alarma</button>

<p id="status">Esperando GPS…</p>

<audio id="alarm" loop>
  <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map, userMarker, destMarker, circle;
let destLat=null, destLng=null;
let alarmActive=false;

map = L.map('map');

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// GPS REAL + seguimiento
navigator.geolocation.watchPosition(pos=>{
  const lat=pos.coords.latitude;
  const lng=pos.coords.longitude;

  if(!userMarker){
    map.setView([lat,lng],15);
    userMarker=L.marker([lat,lng]).addTo(map)
      .bindPopup("📍 Estás aquí");
  } else {
    userMarker.setLatLng([lat,lng]);
  }

  if(destLat && alarmActive){
    const d=dist(lat,lng,destLat,destLng);
    status.textContent=`Distancia: ${Math.round(d)} m`;

    if(d<=parseInt(radius.value)){
      activarAlarma();
    }
  }
},{enableHighAccuracy:true});

// Seleccionar destino
map.on('click',e=>{
  destLat=e.latlng.lat;
  destLng=e.latlng.lng;

  if(destMarker) map.removeLayer(destMarker);
  if(circle) map.removeLayer(circle);

  destMarker=L.marker([destLat,destLng]).addTo(map);
  circle=L.circle([destLat,destLng],{
    radius:parseInt(radius.value),
    color:'red'
  }).addTo(map);

  localStorage.setItem('destino',
    JSON.stringify({lat:destLat,lng:destLng})
  );

  status.textContent="Destino guardado";
});

// Restaurar destino
const saved=localStorage.getItem('destino');
if(saved){
  const d=JSON.parse(saved);
  destLat=d.lat;
  destLng=d.lng;
}

// Activar alarma
startBtn.onclick=()=>{
  if(!destLat){
    alert("Selecciona un destino");
    return;
  }
  alarmActive=true;
  status.textContent="Alarma activada";
};

// Distancia
function dist(a,b,c,d){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  const dLat=toRad(c-a);
  const dLon=toRad(d-b);
  const h=Math.sin(dLat/2)**2+
    Math.cos(toRad(a))*Math.cos(toRad(c))*
    Math.sin(dLon/2)**2;
  return R*(2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h)));
}

// Alarma PRO
function activarAlarma(){
  alarm.play();
  if(navigator.vibrate){
    navigator.vibrate([500,300,500,300,500]);
  }
  mostrarNotificacion();
  alarmActive=false;
}

// Notificación
function mostrarNotificacion(){
  if(Notification.permission==="granted"){
    new Notification("🚨 Estás por llegar",{
      body:"Bájate del camión",
      requireInteraction:true
    });
  } else {
    Notification.requestPermission();
  }
}
</script>

<script>
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
