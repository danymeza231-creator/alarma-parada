<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alarma de Parada — Modo Dios</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{margin:0;font-family:Arial;padding:10px;
background:#111;color:#fff}
#map{height:60vh}
button,input,select{
width:100%;padding:12px;margin-top:8px;font-size:16px}
</style>
</head>

<body>

<h3>👑 Alarma de Parada — DIOS</h3>

<select id="mode">
  <option value="walk">🚶 Caminando</option>
  <option value="bus" selected>🚌 Camión</option>
  <option value="car">🚗 Auto</option>
</select>

<div id="map"></div>

<input id="radius" type="number" value="400">
<button id="startBtn">▶ Iniciar</button>

<p id="status">Esperando GPS…</p>

<audio id="alarm" loop>
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([20.6534, -105.2253], 13); 
let userMarker,destMarker,circle;
let destLat,destLng,active=false;
let avisos={1000:false,500:false};

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// GPS
navigator.geolocation.watchPosition(
  p => {
    const lat = p.coords.latitude;
    const lng = p.coords.longitude;

    if (!userMarker) {
      map.setView([lat, lng], 15);
      userMarker = L.marker([lat, lng]).addTo(map)
        .bindPopup("📍 Estás aquí");
    } else {
      userMarker.setLatLng([lat, lng]);
    }

    status.textContent = "GPS activo";
    
    if (destLat && active) {
      const d = dist(lat, lng, destLat, destLng);
      status.textContent = `Distancia: ${Math.round(d)} m`;

      if (d < 1000 && !avisos[1000]) aviso("1 km para llegar");
      if (d < 500 && !avisos[500]) aviso("500 m para llegar");
      if (d <= radius.value) final();
    }
  },
  err => {
    status.textContent = "GPS no disponible";
    alert("Activa ubicación precisa y permisos");
  },
  {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 15000
  }
);

// Elegir destino
map.on('click',e=>{
  destLat=e.latlng.lat;
  destLng=e.latlng.lng;

  if(destMarker) map.removeLayer(destMarker);
  if(circle) map.removeLayer(circle);

  destMarker=L.marker([destLat,destLng]).addTo(map);
  circle=L.circle([destLat,destLng],{
    radius:+radius.value,color:'red'
  }).addTo(map);

  localStorage.setItem("destino",
   JSON.stringify({lat:destLat,lng:destLng}));
});

// Restaurar
const s=localStorage.getItem("destino");
if(s){const d=JSON.parse(s);destLat=d.lat;destLng=d.lng;}

startBtn.onclick=()=>{
  active=true;
  avisos={1000:false,500:false};
  status.textContent="Alarma activa";
};

// Avisos
function aviso(msg){
  avisos[msg.includes("1 km")?1000:500]=true;
  vibrar();
  noti(msg);
}

// Final
function final(){
  alarm.play();
  vibrar(true);
  noti("🚨 BAJATE AHORA");
  active=false;
}

// Utils
function dist(a,b,c,d){
  const R=6371000,t=x=>x*Math.PI/180;
  const h=Math.sin(t(c-a)/2)**2+
  Math.cos(t(a))*Math.cos(t(c))*
  Math.sin(t(d-b)/2)**2;
  return R*(2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h)));
}

function vibrar(fuerte=false){
  if(navigator.vibrate)
    navigator.vibrate(fuerte?[800,400,800]:[300,200,300]);
}

function noti(t){
  if(Notification.permission==="granted")
    new Notification(t,{requireInteraction:true});
  else Notification.requestPermission();
}
</script>

<script>
if('serviceWorker'in navigator)
navigator.serviceWorker.register('service-worker.js');
</script>

</body>
</html>
